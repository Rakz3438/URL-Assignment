apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urlshortener
  namespace: urlshortener
spec:
  ingressClassName: nginx
  tls:
    - hosts: [sho.rt]
      secretName: sho-rt-tls
  rules:
    - host: sho.rt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: urlshortener-api, port: { name: http } }
