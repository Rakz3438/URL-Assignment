# EXAMPLE ONLY: placeholders, never real values. In a real cluster these come from a secret manager
# (External Secrets Operator / Vault / GCP Secret Manager) rather than a file in git.
apiVersion: v1
kind: Secret
metadata:
  name: urlshortener-secrets
  namespace: urlshortener
type: Opaque
stringData:
  ConnectionStrings__Links: "Host=postgres.data.svc.cluster.local;Database=urlshortener;Username=app;Password=CHANGE_ME;Timeout=3;Command Timeout=5;SSL Mode=Require"
  ConnectionStrings__Redis: "redis.data.svc.cluster.local:6379,abortConnect=false,connectTimeout=1000,syncTimeout=250,ssl=true,password=CHANGE_ME"
  Shortener__VisitorHashSalt: "CHANGE_ME_TO_A_LONG_RANDOM_VALUE"
  Auth__ApiKeys__0: "CHANGE_ME_TO_A_LONG_RANDOM_KEY"
