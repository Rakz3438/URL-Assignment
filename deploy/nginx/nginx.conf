# Reverse proxy in front of the API replicas (compose profile "app").
# Sets X-Forwarded-For / -Proto; the API trusts these ONLY because the compose network is listed in
# Network__TrustedNetworks (Scenario 3: forwarding is off unless the proxy is explicitly trusted).
worker_processes auto;
events { worker_connections 4096; }

http {
  # Docker's embedded DNS returns every replica of "api"; re-resolve so scaling up/down is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  access_log off;

  upstream api {
    zone api 64k;
    server api:8080 resolve;
    keepalive 64;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # Overwrite (not append): clients cannot inject their own X-Forwarded-For chain past the proxy.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }
  }
}
