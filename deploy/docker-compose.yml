# Backing services for local development and verification.
# Usage:  docker compose -f deploy/docker-compose.yml up -d --wait
# Credentials here are local-development values only; real deployments inject secrets (see docs).
name: urlshortener

# Shared settings for the application containers (profile "app"). Local-development secrets only:
# real deployments inject them from a secret store (see k8s/ and docs).
x-app-env: &app-env
  Database__Provider: Postgres
  ConnectionStrings__Links: "Host=postgres;Port=5432;Database=urlshortener;Username=app;Password=local-dev-only;Timeout=3;Command Timeout=5"
  Shortener__VisitorHashSalt: local-compose-salt-not-a-real-secret
  Auth__ApiKeys__0: compose-demo-api-key-0123456789

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: urlshortener
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d urlshortener"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    # Cache only: no persistence needed. Bounded memory with LRU eviction so the cache can never exhaust the host.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.8.1
    # Single-node KRaft (no ZooKeeper). Two listeners: HOST for processes on the laptop, DOCKER for containers.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: HOST://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot: create the topic explicitly (auto-create is disabled so a typo can't silently create topics).
  # 6 partitions keyed by short code: up to 6 worker instances in parallel, per-link ordering preserved.
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic link-clicks --partitions 6 --replication-factor 1 --config retention.ms=604800000
    restart: "no"

  # Optional: OpenTelemetry viewer for logs, metrics and traces (Scenario 3, R3).
  #   docker compose -f deploy/docker-compose.yml --profile observability up -d
  # UI: http://localhost:18888   OTLP endpoint for the apps: http://localhost:4317
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.1
    profiles: ["observability"]
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true" # local development only
    ports: ["18888:18888", "4317:18889"]

  # ---------------------------------------------------------------------------------------------------------
  # Application containers (compose profile "app"): everything runs in Docker, nothing on the host.
  #   docker compose -f deploy/docker-compose.yml --profile app up -d --build --wait
  #   curl http://localhost:8080/health/ready
  # ---------------------------------------------------------------------------------------------------------
  migrate:
    profiles: ["app"]
    build: { context: .., dockerfile: src/UrlShortener.Api/Dockerfile }
    image: urlshortener-api:local
    environment:
      <<: *app-env
      Database__MigrateOnly: "true"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    image: urlshortener-api:local
    deploy: { replicas: 2 }   # stateless: any replica serves any request (NFR-3)
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "false"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false,connectTimeout=1000,syncTimeout=250"
      Analytics__Mode: Kafka
      Kafka__BootstrapServers: kafka:29092
      Shortener__PublicBaseUrl: http://localhost:8080
      Network__TrustedNetworks__0: 172.28.0.0/16   # the compose network: only nginx can set X-Forwarded-For
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 30

  worker:
    profiles: ["app"]
    build: { context: .., dockerfile: src/UrlShortener.AnalyticsWorker/Dockerfile }
    image: urlshortener-worker:local
    environment:
      <<: *app-env
      Kafka__BootstrapServers: kafka:29092
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  proxy:
    profiles: ["app"]
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:8080"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:

networks:
  default:
    ipam:
      config: [{ subnet: 172.28.0.0/16 }]
